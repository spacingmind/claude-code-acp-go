name: Feature request
description: Suggest an addition or change to claude-code-acp-go
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and how does the current agent fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional — a sketch of the ACP method/behavior or API shape you have in mind.
    validations:
      required: false
