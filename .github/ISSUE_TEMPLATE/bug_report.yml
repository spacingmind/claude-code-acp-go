name: Bug report
description: Report a problem with claude-code-acp-go
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or ACP client config that trigger the issue.
      placeholder: |
        1. Connect an ACP client with...
        2. Send session/prompt with...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go version output, e.g. go1.23.4
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: claude-code-acp-go version
      placeholder: e.g. v0.1.0, or a commit SHA
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, ACP client used (e.g. Zed), claude CLI version, environment details, etc.
    validations:
      required: false
