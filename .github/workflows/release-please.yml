# Runs on every push to `main` -- which, under this repo's branching model,
# only happens when a `develop` -> `main` release PR is merged (feature
# work lands on `develop` via PR first; `main` is release-only).
#
# release-please inspects Conventional Commits (feat:/fix:/BREAKING CHANGE)
# accumulated since the last release, and either:
#   - opens/updates a "chore(main): release X.Y.Z" PR containing the
#     version bump + CHANGELOG.md, if there's nothing to release yet, or
#   - once that release PR is itself merged, creates the vX.Y.Z git tag
#     and a (plain) GitHub Release.
#
# Deliberately NOT using skip-github-release: that flag breaks
# release-please's own tag-tracking (a known upstream issue -- it gets
# permanently stuck reporting "untagged, merged release PRs outstanding"
# after the first release, see googleapis/release-please#1561 and
# googleapis/release-please-action#1034). Instead, we let release-please
# create its own release normally, and the goreleaser job below
# overwrites it with our nicer-formatted one (release.mode: replace).
#
# The goreleaser job runs in THIS workflow, gated on
# `release_created`, rather than relying on release.yml's tag-push
# trigger: release-please-action pushes its tag using the default
# GITHUB_TOKEN, and GitHub deliberately does not fire other workflows
# for pushes made with that token (recursion guard) -- see
# googleapis/release-please-action#1000. release.yml still exists as a
# fallback for manually-pushed tags.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
